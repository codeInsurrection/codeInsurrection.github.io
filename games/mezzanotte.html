<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mezzanotte · A daily game of Lights Out</title>
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      body{
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
        background:#0f1117;color:#d8d8d8;
        display:flex;justify-content:center;align-items:center;
        min-height:100vh;padding:1rem;
      }
      #app{text-align:center;max-width:420px;width:100%}
      h1{font-size:2rem;font-weight:700;letter-spacing:.04em}
      .sub{color:#777;font-size:.85rem;margin:.15rem 0 1.4rem}
      
      .stats{display:flex;gap:.75rem;justify-content:center;margin-bottom:1rem}
      .stat{background:#1a1d27;border-radius:8px;padding:.45rem 1rem;min-width:90px}
      .stat-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:#555}
      .stat-value{font-size:1.35rem;font-weight:700;margin-top:.1rem}
      .stat-value.lit{color:#f4c430}
      .stat-value.lit.zero{color:#5ddc8e}
      
      .grid{
        display:grid;
        grid-template-columns:repeat(var(--n,5),1fr);
        gap:4px;
        background:#12141c;
        padding:6px;
        border-radius:12px;
        margin:0 auto 1.25rem;
        max-width:340px;
        aspect-ratio:1;
      }
      .cell{
        border-radius:6px;
        cursor:pointer;
        user-select:none;
        aspect-ratio:1;
        transition:background .12s ease,box-shadow .12s ease,transform .1s ease;
      }
      .cell:hover{transform:scale(1.05)}
      .cell:active{transform:scale(.94)}
      
      /* OFF — dark recessed socket */
      .cell[data-state="0"]{
        background:#1a1d2e;
        box-shadow:inset 0 2px 5px rgba(0,0,0,.55);
      }
      /* ON — lit bulb with a warm glow */
      .cell[data-state="1"]{
        background:#f4c430;
        box-shadow:0 0 12px 2px rgba(244,196,48,.35),
                   0 0 3px 1px rgba(244,196,48,.55);
      }
      .cell.solved-glow{
        background:#1a1d2e;
        box-shadow:inset 0 0 0 1.5px rgba(93,220,142,.35);
      }
      
      .controls{display:flex;gap:.65rem;justify-content:center;margin-bottom:.75rem;flex-wrap:wrap}
      button{
        background:#1a1d27;color:#d8d8d8;border:1px solid #2a2d37;
        border-radius:8px;padding:.55rem 1.1rem;font-size:.85rem;
        cursor:pointer;transition:background .15s,border-color .15s;font-family:inherit;
      }
      button:hover{background:#252830;border-color:#3a3d47}
      button.primary{background:#1e3a2a;border-color:#2d5a3d;color:#8fddaa}
      button.primary:hover{background:#264a35}
      
      .seed-info{font-size:.7rem;color:#444;margin-top:.4rem}
      .msg{min-height:1.4rem;font-size:.85rem;color:#777;margin-top:1.6rem}
      .msg.win{color:#5ddc8e;font-weight:600}
      
      @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
      .grid.won{animation:pop .35s ease}
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Mezzanotte</h1>
      <p class="sub">Tap a tile to toggle it and its neighbours. Turn them all off.</p>
      
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Moves</div>
          <div class="stat-value" id="moves">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Lit</div>
          <div class="stat-value lit" id="lit">0</div>
        </div>
      </div>
      
      <div class="grid" id="grid"></div>
      
      <div class="controls">
        <button class="primary" id="btn-today">Today's Puzzle</button>
        <button id="btn-random">New Random</button>
      </div>
      <div class="seed-info" id="seed-info"></div>
      <div class="msg" id="msg"></div>
    </div>
    
    <script>
      /* ═══════════════════════════════════════════════════════════
       CONSTANTS
       ═══════════════════════════════════════════════════════════ */
      const N = 5;                       // 5×5 is the classic feel; try 6 for harder
      
      /* ═══════════════════════════════════════════════════════════
       SEEDED RNG  (same mulberry32 as Triad)
       ═══════════════════════════════════════════════════════════ */
      function mulberry32(seed){
        return function(){
          seed|=0; seed=seed+0x6D2B79F5|0;
          let t=Math.imul(seed^(seed>>>15),1|seed);
          t=t+Math.imul(t^(t>>>7),61|t)^t;
          return((t^(t>>>14))>>>0)/4294967296;
        };
      }
      function shuffle(arr,rng){
        const a=[...arr];
        for(let i=a.length-1;i>0;i--){
          const j=Math.floor(rng()*(i+1));
          [a[i],a[j]]=[a[j],a[i]];
        }
        return a;
      }
      
      /* ═══════════════════════════════════════════════════════════
       CORE MECHANIC
       Toggle a cell and its N/S/E/W neighbours (in-bounds only).
       The whole game is this one function.
       ═══════════════════════════════════════════════════════════ */
      function toggle(grid,r,c){
        grid[r][c]^=1;
        if(r>0)     grid[r-1][c]^=1;
        if(r<N-1)   grid[r+1][c]^=1;
        if(c>0)     grid[r][c-1]^=1;
        if(c<N-1)   grid[r][c+1]^=1;
      }
      
      function countLit(grid){
        let n=0;
        for(let r=0;r<N;r++)
          for(let c=0;c<N;c++)
            n+=grid[r][c];
        return n;
      }
      
      /* ═══════════════════════════════════════════════════════════
       PUZZLE GENERATION
       Start from all-off, click random cells to scramble.
       Because every toggle is its own inverse and commutative,
       clicking the same set of cells in any order un-scrambles,
       so the puzzle is ALWAYS solvable by construction.
       ═══════════════════════════════════════════════════════════ */
      function generateLightsOut(seed){
        const rng=mulberry32(seed);
        const grid=Array.from({length:N},()=>Array(N).fill(0));
        
        // Click roughly 30–40% of the cells to scramble
        const target=Math.floor(N*N*0.3)+Math.floor(rng()*Math.ceil(N*N*0.12));
        const clicked=new Set();
        
        for(let i=0;i<target;i++){
          const r=Math.floor(rng()*N);
          const c=Math.floor(rng()*N);
          toggle(grid,r,c);
          clicked.add(r+','+c);
        }
        
        // Safety: don't ship an already-solved board
        if(countLit(grid)===0){
          toggle(grid,0,0);
          clicked.add('0,0');
        }
        
        return{grid,par:clicked.size};
      }
      
      /* ═══════════════════════════════════════════════════════════
       STATE
       ═══════════════════════════════════════════════════════════ */
      const S={grid:null,moves:0,solved:false,seed:0};
      
      /* ═══════════════════════════════════════════════════════════
       RENDER
       ═══════════════════════════════════════════════════════════ */
      const gridEl=document.getElementById('grid');
      const movesEl=document.getElementById('moves');
      const litEl=document.getElementById('lit');
      const msgEl=document.getElementById('msg');
      const seedEl=document.getElementById('seed-info');
      
      function render(){
        gridEl.innerHTML='';
        for(let r=0;r<N;r++){
          for(let c=0;c<N;c++){
            const cell=document.createElement('div');
            cell.className='cell';
            cell.dataset.state=S.grid[r][c];
            if(S.solved) cell.classList.add('solved-glow');
            cell.addEventListener('click',()=>onClick(r,c));
            gridEl.appendChild(cell);
          }
        }
        movesEl.textContent=S.moves;
        const lit=S.solved?0:countLit(S.grid);
        litEl.textContent=lit;
        litEl.classList.toggle('zero',lit===0);
      }
      
      function onClick(r,c){
        if(S.solved) return;
        toggle(S.grid,r,c);
        S.moves++;
        if(countLit(S.grid)===0){
          S.solved=true;
          render();
          gridEl.classList.add('won');
          msgEl.textContent='Solved in '+S.moves+' move'+(S.moves!==1?'s':'')+'!';
          msgEl.classList.add('win');
          setTimeout(()=>gridEl.classList.remove('won'),350);
        }else{
          render();
          msgEl.textContent='';
          msgEl.classList.remove('win');
        }
      }
      
      function loadPuzzle(seed,label){
        const g=generateLightsOut(seed);
        S.grid=g.grid;
        S.seed=g.seed;
        S.moves=0;
        S.solved=false;
        gridEl.style.setProperty('--n',N);
        render();
        msgEl.innerHTML = '<b>Mezzanotte</b><br><span style="margin-top: 0.15rem; display:inline-block;">Part of the FindMe puzzle series</span>';
        msgEl.classList.remove('win');
        seedEl.textContent=label+'   ·   seed '+seed;
      }
      
      /* ═══════════════════════════════════════════════════════════
       DAILY SEED  (identical scheme to Triad so both share a seed)
       ═══════════════════════════════════════════════════════════ */
      function todaySeed(){
        const d=new Date();
        return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
      }
      function todayLabel(){
        return'Today · '+new Date().toLocaleDateString(undefined,{
          weekday:'long',month:'short',day:'numeric'
        });
      }
      
      /* ═══════════════════════════════════════════════════════════
       WIRE UP
       ═══════════════════════════════════════════════════════════ */
      document.getElementById('btn-today').addEventListener('click',()=>
              loadPuzzle(todaySeed(),todayLabel()));
      document.getElementById('btn-random').addEventListener('click',()=>
              loadPuzzle(Math.floor(Math.random()*2**31),'Random'));
      
      loadPuzzle(todaySeed(),todayLabel());
    </script>
  </body>
</html>
